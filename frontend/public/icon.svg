<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- TravelTrack app icon / favicon: the logo mark (logo-mark.svg) on the
       app's dark surface, so it reads on light and dark browser tabs alike.
       Larger shapes and heavier strokes than the mark, to stay legible at
       16px. -->
  <rect width="64" height="64" rx="14" fill="#2d3439" />

  <g stroke="#00c46a" stroke-linecap="round">
    <circle cx="26" cy="38" r="19" stroke-width="5" />
    <ellipse cx="26" cy="38" rx="8" ry="19" stroke-width="4" />
    <path d="M7 38h38" stroke-width="4" />
  </g>

  <!-- Pin with a dark outline that cuts it out of the globe. -->
  <path
    d="M45 42 35.04 24.75A11.5 11.5 0 1 1 54.96 24.75Z"
    fill="#ffb545"
    stroke="#2d3439"
    stroke-width="5"
    stroke-linejoin="round"
    paint-order="stroke"
  />
  <circle cx="45" cy="19" r="4.2" fill="#2d3439" />
</svg>
