# Verifies every push and pull request: lint, tests, production build.
# Deployment is done by Vercel's GitHub integration, not by this workflow.
# No secrets are used: the tests mock Supabase, and the build only needs
# placeholder values (a real deployment gets its values from Vercel).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from the lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit runtime dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Build (trip tracking off)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_TRIPS_ENABLED: "false"

      - name: Build (trip tracking on)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_TRIPS_ENABLED: "true"
